<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Summary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

    
        <section class="result-card">

            <h3>Your Result</h3>

            <div class="score-circle">
                <span class="score">76</span>
                <span class="out-of">of 100</span>
            </div>

            <h1>Great</h1>

            <p>
                You scored higher than 65% of the people
                who have taken these tests.
            </p>

        </section>


    
        <section class="summary-card">

            <h2>Summary</h2>

            <div class="summary-list">

                <div class="summary-item reaction">
                    <div class="category">
                        <span class="icon">ϟ</span> 
                        <span>Reaction</span>
                    </div>

                    <div class="score">
                        <strong>80</strong>
                        <span>/ 100</span>
                    </div>
                </div>


                <div class="summary-item memory">
                    <div class="category">
                        <span class="icon">♧</span>
                        <span>Memory</span>
                    </div>

                    <div class="score">
                        <strong>92</strong>
                        <span>/ 100</span>
                    </div>
                </div>


                <div class="summary-item verbal">
                    <div class="category">
                        <span class="icon">▢</span>
                        <span>Verbal</span>
                    </div>

                    <div class="score">
                        <strong>61</strong>
                        <span>/ 100</span>
                    </div>
                </div>


                <div class="summary-item visual">
                    <div class="category">
                        <span class="icon">◉</span>
                        <span>Visual</span>
                    </div>

                    <div class="score">
                        <strong>73</strong>
                        <span>/ 100</span>
                    </div>
                </div>

            </div>

            <button>Continue</button>

        </section>

    </main>

</body>
</html>
